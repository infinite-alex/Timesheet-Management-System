spring.datasource.url=jdbc:postgresql://localhost:5432/timesheetdb
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.admin.password=${ADMIN_PASSWORD:}
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}
app.security.max-login-failures=5
app.security.max-login-failures-per-ip=20
app.security.max-registrations-per-ip=10
app.security.lockout-minutes=15
