<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Pontaj')}"></head>
<body>
<header th:replace="~{fragments :: hero('Pontajul tău', 'Vezi ce ai lucrat și adaugă rapid ore noi.', ${username}, 'Angajat', null)}"></header>

<main>
    <div class="stats">
        <div class="stat">
            <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
            <div><div class="stat-label">Total ore</div><div class="stat-value" th:text="|${totalMinutes / 60}h ${totalMinutes % 60}m|">0h 0m</div></div>
        </div>
        <div class="stat">
            <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></span>
            <div><div class="stat-label">Înregistrări</div><div class="stat-value" th:text="${#lists.size(entries)}">0</div></div>
        </div>
        <div class="stat">
            <span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h1M14 9h1M9 13h1M14 13h1"/></svg></span>
            <div><div class="stat-label">Clienți lucrați</div><div class="stat-value" th:text="${clientCount}">0</div></div>
        </div>
    </div>

    <div class="card">
        <div class="card-head">
            <div class="tabs">
                <button type="button" class="tab active" data-tab="lista">Pontajele mele <span class="count" th:text="${#lists.size(entries)}">0</span></button>
                <button type="button" class="tab" data-tab="adauga">Adaugă pontaj</button>
            </div>
            <input class="search" type="search" placeholder="Caută în pontaje" data-filter="#entriesTable" data-show-on="lista" />
        </div>

        <div class="panel active" data-panel="lista">
            <div class="empty" th:if="${#lists.isEmpty(entries)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                <h3>Niciun pontaj încă</h3>
                <p>Adaugă prima înregistrare și o vei vedea aici.</p>
                <button type="button" class="btn btn-primary" data-goto="adauga">Adaugă primul pontaj</button>
            </div>

            <div class="table-wrap" th:unless="${#lists.isEmpty(entries)}">
                <table id="entriesTable">
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Client</th>
                            <th>Luna</th>
                            <th>Durată</th>
                            <th>Sarcină</th>
                            <th>Notă</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="entry : ${entries}">
                            <td class="num" th:text="|${#numbers.formatInteger(entry.date().dayOfMonth, 2)}.${#numbers.formatInteger(entry.date().monthValue, 2)}.${entry.date().year}|"></td>
                            <td>
                                <span th:if="${entry.clientName() != null}" th:text="${entry.clientName()}" style="font-weight:600"></span>
                                <span th:if="${entry.clientName() == null}" class="muted">Fără client</span>
                            </td>
                            <td><span class="pill pill-brand" th:text="${#strings.capitalize(#strings.toLowerCase(entry.workingmonth()))}"></span></td>
                            <td class="num" th:text="|${entry.totalMinutes() / 60}h ${entry.totalMinutes() % 60}m|"></td>
                            <td>
                                <span class="muted" th:if="${#lists.isEmpty(entry.actions())}">—</span>
                                <span th:each="a : ${entry.actions()}" th:text="${a}"></span>
                            </td>
                            <td class="muted" th:text="${entry.extranote() == null or entry.extranote() == ''} ? '—' : ${entry.extranote()}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel" data-panel="adauga">
            <div class="card-body">
                <form id="entryForm">
                    <div class="form-grid">
                        <div class="field">
                            <label for="date">Data</label>
                            <input class="input" type="date" id="date" required />
                        </div>
                        <div class="field">
                            <label for="workingmonth">Luna de lucru</label>
                            <select class="input" id="workingmonth" required>
                                <option th:each="m : ${months}" th:value="${m}" th:text="${#strings.capitalize(#strings.toLowerCase(m))}"></option>
                            </select>
                        </div>
                        <div class="field full">
                            <label for="clientId">Client</label>
                            <select class="input" id="clientId">
                                <option value="">Fără client</option>
                                <option th:each="c : ${clients}" th:value="${c.id()}" th:text="${c.name()}"></option>
                            </select>
                        </div>
                        <div class="field full">
                            <label for="task">Sarcină</label>
                            <select class="input" id="task" required>
                                <option value="" selected disabled>Alege sarcina</option>
                                <optgroup th:each="group : ${taskGroups}" th:label="${group.key}">
                                    <option th:each="t : ${group.value}" th:value="${t}" th:text="${t}"></option>
                                </optgroup>
                            </select>
                            <span class="hint">O sarcină pe pontaj. Pentru mai multe sarcini, adaugă pontaje separate.</span>
                        </div>
                        <div class="field full">
                            <label>Durată</label>
                            <div class="duration">
                                <div class="suffix"><input class="input" type="number" id="hours" min="0" max="24" value="0" /><span>ore</span></div>
                                <div class="suffix"><input class="input" type="number" id="minutes" min="0" max="59" value="0" /><span>min</span></div>
                            </div>
                        </div>
                        <div class="field full">
                            <label for="extranote">Notă</label>
                            <textarea class="input" id="extranote" placeholder="Detalii despre ce ai lucrat (opțional)"></textarea>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn" style="background:var(--bg);color:var(--ink-soft)" data-goto="lista">Renunță</button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">Salvează pontajul</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/app.js}"></script>
<script>
    var dateInput = document.getElementById('date');
    var monthSelect = document.getElementById('workingmonth');
    var today = new Date();
    dateInput.value = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
    monthSelect.selectedIndex = today.getMonth();
    dateInput.addEventListener('change', function () {
        if (dateInput.value) monthSelect.selectedIndex = Number(dateInput.value.split('-')[1]) - 1;
    });

    submitForm(
        document.getElementById('entryForm'),
        document.getElementById('saveBtn'),
        function () {
            var total = Number(document.getElementById('hours').value || 0) * 60 + Number(document.getElementById('minutes').value || 0);
            if (total <= 0) { toast('Introdu o durată mai mare de zero.', 'error'); return null; }
            var client = document.getElementById('clientId').value;
            return {
                date: dateInput.value,
                employeeId: null,
                clientId: client ? Number(client) : null,
                workingmonth: monthSelect.value,
                totalMinutes: total,
                actions: [document.getElementById('task').value],
                extranote: document.getElementById('extranote').value
            };
        },
        '/api/timesheet-entries',
        function () { location.hash = 'lista'; location.reload(); }
    );
</script>
</body>
</html>
