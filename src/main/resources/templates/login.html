<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        :root {
            --red: #d62828;
            --red-dark: #a51d1d;
            --black: #161616;
            --gray: #f4f4f4;
            --gray-border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--black);
            color: var(--black);
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            background: #fff;
            border-radius: 10px;
            padding: 36px 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            border-top: 4px solid var(--red);
        }

        h1 {
            margin: 0 0 28px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        form div {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #444;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--gray-border);
            border-radius: 6px;
            font-size: 14px;
            background: var(--gray);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--red);
            box-shadow: 0 0 0 3px rgba(214, 40, 40, 0.15);
            background: #fff;
        }

        button[type="submit"] {
            width: 100%;
            background: var(--red);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.15s ease;
        }

        button[type="submit"]:hover {
            background: var(--red-dark);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Autentificare</h1>
        <form th:action="@{/login}" method="post">
            <div>
                <label>Username</label>
                <input type="text" name="username" />
            </div>
            <div>
                <label>Parolă</label>
                <input type="password" name="password" />
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
