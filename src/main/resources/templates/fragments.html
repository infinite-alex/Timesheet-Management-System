<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Pontaj</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2310b981'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Cpath d='M16 11v5l3 2' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="hero" th:fragment="hero(title, subtitle, username, role)">
    <div class="hero-inner">
        <nav class="nav">
            <div class="brand">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
                </span>
                <span>Pontaj</span>
            </div>
            <div class="nav-right">
                <div class="user-chip">
                    <span class="avatar" th:text="${#strings.toUpperCase(#strings.substring(username, 0, 1))}">A</span>
                    <div>
                        <strong th:text="${username}">utilizator</strong>
                        <small th:text="${role}">Angajat</small>
                    </div>
                </div>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost">Deconectare</button>
                </form>
            </div>
        </nav>
        <div class="page-title">
            <h1 th:text="${title}">Titlu</h1>
            <p th:text="${subtitle}">Subtitlu</p>
        </div>
    </div>
</header>
</body>
</html>
